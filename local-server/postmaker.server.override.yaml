services:
  redis:
    image: stackfolio-redis:deploy
    mem_limit: 80m
    memswap_limit: 128m
    cpus: 0.25
    pids_limit: 64

  rsshub:
    image: stackfolio-rsshub:deploy
    mem_limit: 448m
    memswap_limit: 640m
    cpus: 0.50
    pids_limit: 128

  dataradar:
    image: stackfolio-postmaker-dataradar:deploy
    build: !reset null
    mem_limit: 256m
    memswap_limit: 384m
    cpus: 0.50
    pids_limit: 128

  postmaker:
    image: stackfolio-postmaker-postmaker:deploy
    build: !reset null
    mem_limit: 256m
    memswap_limit: 384m
    cpus: 0.50
    pids_limit: 128
